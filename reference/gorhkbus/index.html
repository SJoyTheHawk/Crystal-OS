<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Next Bus — HK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+HK:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0f; --panel:#14181d; --panel-2:#1b2026; --line:#262b31;
    --amber:#ffb020; --amber-dim:#7a5c1e; --text:#e9e6e0; --muted:#868d96;
    --kmb:#e4572e; --lwb:#3aa0a0; --ctb:#3a72e4; --danger:#e0524a;
    --fs-card-rn:19.5px; --fs-card-to:15px; --fs-card-sn:12.5px; --fs-card-eta:17px;
    --fs-title:24px; --fs-sub:10.5px; --fs-tab:13.5px; --fs-hint:12px;
    --fs-route-display:24px; --fs-route-ph:12.5px; --fs-key:17px; --fs-letter:16px;
    --fs-msg:13px;
    --fs-btn:11px; --fs-fab:20px; --fab-size:48px;
    --fs-neighbor:13px; --fs-neighbor-eta:16px; --fs-neighbor-title:13px; --fs-neighbor-hint:11px;
  }
  body.font-lg{
    --fs-card-rn:29px; --fs-card-to:23px; --fs-card-sn:19px; --fs-card-eta:26px;
    --fs-title:36px; --fs-sub:14px; --fs-tab:20px; --fs-hint:18px;
    --fs-route-display:36px; --fs-route-ph:19px; --fs-key:22px; --fs-letter:20px;
    --fs-msg:19.5px;
    --fs-btn:16px; --fs-fab:28px; --fab-size:58px;
    --fs-neighbor:18px; --fs-neighbor-eta:22px; --fs-neighbor-title:18px; --fs-neighbor-hint:15px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Noto Sans HK',system-ui,-apple-system,sans-serif;min-height:100vh;padding:18px 14px 80px;max-width:520px;margin:0 auto;}
  
  /* Top header adjustments */
  header{margin-bottom:16px;display:flex;flex-direction:column;gap:10px;}
  .header-top{display:flex;justify-content:space-between;align-items:center;width:100%;}
  h1{font-size:var(--fs-title);font-weight:800;margin:0;letter-spacing:-0.01em;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.6);}
  .hdr-btn{flex:0 0 auto;background:rgba(15,17,20,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2);color:var(--text);font-weight:700;font-size:12px;padding:6px 10px;border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .header-btns{display:flex;gap:8px;align-items:center;}
  #themeBtn{font-size:16px;padding:6px 10px;}

  
  /* Bus image banner */
  header{position:relative; margin-bottom:16px; display:flex; flex-direction:column; gap:10px;}
  .header-top{display:flex; justify-content:space-between; align-items:center; width:100%; z-index:2; position:relative;}
  body.theme-dark .header-top, body.theme-light .header-top {
    position:absolute; top:0; left:0; right:0; padding:12px 14px; z-index:5;
  }
  body.theme-dark .bus-banner, body.theme-light .bus-banner { margin-top:0; }
  body.theme-cartoon .header-top { position:relative; padding:0; }
  .bus-banner{
    width:100%;
    position:relative;
    height:150px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#000;
    display:block;
  }
  body.theme-dark .bus-banner::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.3) 48%, rgba(0,0,0,0) 78%);
    pointer-events:none; z-index:1;
  }
  body.theme-light .bus-banner::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.32) 48%, rgba(255,255,255,0) 78%);
    pointer-events:none; z-index:1;
  }
  .bus-img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 35%;
    display:block;
  }
  .banner-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-start;
    padding:12px 14px;
    background:linear-gradient(180deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.3) 48%, rgba(0,0,0,0) 78%);
  }
  .banner-overlay .header-top{width:100%;}
  
  /* Subtitle text below bus image with footer font size */
  .sub{color:#565b62;font-size:var(--fs-sub);line-height:1.5;margin:2px 0 0;text-align:center;}

  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab-btn{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:var(--fs-tab);padding:11px;border-radius:12px;cursor:pointer;font-family:inherit;}
  .tab-btn.active{background:var(--panel-2);color:var(--amber);border-color:var(--amber);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  .search-row{display:flex;gap:8px;align-items:stretch;}
  .route-display{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:var(--fs-route-display);font-weight:800;letter-spacing:.04em;min-height:24px;text-align:center;}
  .route-display.placeholder{color:#565b62;font-size:var(--fs-route-ph);font-weight:600;letter-spacing:0;}
  .search-icon-btn{flex:0 0 50px;background:var(--amber);color:#1a1200;border:none;border-radius:10px;font-size:19px;cursor:pointer;font-family:inherit;}
  .keypad-wrap{display:flex;gap:10px;margin-top:10px;align-items:stretch;}
  .num-pad{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .key{background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:var(--fs-key);padding:14px 0;border-radius:10px;cursor:pointer;font-family:inherit;}
  .key:active{border-color:var(--amber);background:#20262d;}
  .key.clear{color:var(--danger);font-size:15px;}
  .key.back{font-size:18px;}
  .letter-col{flex:0 0 72px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;padding-right:2px;scrollbar-width:thin;}
  .letter-key{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:var(--fs-letter);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .letter-key:active{border-color:var(--amber);background:#20262d;}
  .hint{font-size:var(--fs-hint);color:var(--muted);margin-top:8px;line-height:1.5;}
  .retry-link{background:none;border:none;color:var(--amber);font-size:12.5px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;}
  .results-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
  .route-opt{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left;width:100%;font-family:inherit;color:var(--text);}
  .route-opt:active{border-color:var(--amber);}
  .badge{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 6px;border-radius:5px;color:#0a0c0f;}
  .badge-kmb{background:var(--kmb);} .badge-lwb{background:var(--lwb);} .badge-ctb{background:var(--ctb);}
  .route-num{font-weight:800;font-size:15px;min-width:36px;flex:0 0 auto;}
  .route-dest{font-size:13px;color:var(--muted);line-height:1.4;}
  .selected-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;}
  .selected-head .route-num{font-size:21px;}
  .selected-head .route-dest{color:var(--text);font-size:14px;flex:1 1 auto;}
  .change-btn{background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;}
  .stop-list{margin-top:6px;display:flex;flex-direction:column;gap:6px;max-height:170px;overflow-y:auto;padding:2px;}
  .stop-opt{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-family:inherit;color:var(--text);font-size:13.5px;text-align:left;width:100%;}
  .stop-opt.nearest{border-color:var(--amber);background:#241c0c;}
  .stop-opt .tag{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--amber);}
  .stop-opt .map-btn{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--amber);font-size:14px;padding:4px 8px;border-radius:8px;cursor:pointer;font-family:inherit;margin-left:auto;}
  .live-label{font-size:13px;color:var(--muted);margin:14px 0 2px;}
  .live-label strong{color:var(--text);font-weight:700;}
  .board{background:#050607;border:1px solid #23272c;border-radius:12px;padding:6px;margin-top:6px;}
  .eta-row{display:flex;align-items:baseline;justify-content:space-between;padding:12px 10px;border-bottom:1px dashed #1c2025;}
  .eta-row:last-child{border-bottom:none;}
  .eta-dest{font-size:13px;color:#c9c5bd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
  .eta-time{font-family:'Share Tech Mono',monospace;font-size:22px;color:var(--amber);text-shadow:0 0 8px rgba(255,176,32,.45);white-space:nowrap;}
  .eta-time small{font-size:12px;color:var(--amber-dim);margin-left:2px;}
  .action-row{display:flex;gap:8px;margin-top:8px;}
  .action-btn{flex:1;background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-weight:700;font-size:12.5px;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;}
  .action-btn.on{color:var(--amber);border-color:var(--amber);}
  .msg{font-size:var(--fs-msg);color:var(--muted);padding:8px 2px;line-height:1.5;}
  .msg.error{color:var(--danger);}
  .msg.loading::after{content:'…';}

  /* Favorite station cards */
  .stop-fav-card{position:relative;padding:12px 14px;}
  .stop-fav-line1{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;min-width:0;}
  .stop-fav-line1 .left{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden;}
  .stop-fav-line1 .rn{font-size:var(--fs-card-rn);font-weight:800;color:var(--text);flex:0 0 auto;}
  .stop-fav-line1 .to{font-size:var(--fs-card-to);font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stop-fav-line1 .etas{flex:0 0 auto;display:flex;gap:8px;font-family:'Share Tech Mono',monospace;font-size:var(--fs-card-eta);color:var(--amber);text-shadow:0 0 6px rgba(255,176,32,.35);}
  .stop-fav-line1 .etas .t small{font-size:0.65em;color:var(--amber-dim);}
  .stop-fav-line2{display:flex;align-items:center;gap:8px;}
  .stop-fav-line2 .sn{flex:1;font-size:var(--fs-card-sn);color:var(--muted);line-height:1.35;min-width:0;}
  .stop-fav-map{background:none;border:1px solid var(--line);color:var(--amber);font-size:var(--fs-btn);padding:4px 8px;border-radius:8px;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .stop-fav-rm{background:none;border:1px solid var(--line);color:var(--muted);font-size:var(--fs-btn);padding:5px 8px;border-radius:8px;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .stop-fav-line3{display:none;margin-top:10px;gap:10px;flex-wrap:wrap;align-items:center;}
  .stop-fav-line3 .etas{display:flex;gap:12px;font-family:'Share Tech Mono',monospace;font-size:var(--fs-card-eta);color:var(--amber);text-shadow:0 0 6px rgba(255,176,32,.35);}
  .stop-fav-line3 .etas .t small{font-size:0.65em;color:var(--amber-dim);}

  body.font-lg #stationsPanel{-webkit-overflow-scrolling:touch;}
  body.font-lg .stop-fav-card{
    min-height:0;
    display:flex;flex-direction:column;justify-content:flex-start;
    padding:12px 14px;margin-bottom:10px;
  }
  body.font-lg .stop-fav-line1 .etas{display:none;}
  body.font-lg .stop-fav-line3{display:flex;margin-top:6px;}
  body.font-lg .stop-fav-line1{margin-bottom:6px;}
  body.font-lg .stop-fav-line2{margin-bottom:2px;}

  .fab-stack{position:fixed;right:16px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:40;pointer-events:none;}
  .fab{pointer-events:auto;width:var(--fab-size);height:var(--fab-size);border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:var(--fs-fab);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45);font-family:inherit;padding:0;}
  .fab:active{border-color:var(--amber);color:var(--amber);}
  .fab.hidden{display:none;}
  .neighbor-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
  .neighbor-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:360px;max-height:70vh;display:flex;flex-direction:column;overflow:hidden;}
  .neighbor-title{padding:12px 14px;font-size:var(--fs-neighbor-title);font-weight:700;color:var(--amber);border-bottom:1px solid var(--line);}
  .neighbor-list{overflow-y:auto;padding:8px;flex:1;-webkit-overflow-scrolling:touch;}
  .neighbor-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-bottom:1px dashed #1c2025;font-size:var(--fs-neighbor);}
  .neighbor-row:last-child{border-bottom:none;}
  .neighbor-row.current{background:#241c0c;border-radius:8px;border-bottom:none;margin-bottom:4px;}
  .neighbor-name{flex:1;color:var(--text);line-height:1.35;}
  .neighbor-eta{font-family:'Share Tech Mono',monospace;font-size:var(--fs-neighbor-eta);color:var(--amber);white-space:nowrap;}
  .neighbor-eta small{font-size:10px;color:var(--amber-dim);}
  .neighbor-hint{padding:8px 14px 12px;font-size:var(--fs-neighbor-hint);color:var(--muted);text-align:center;}

  /* Settings slide-out panel */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));
    transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto;max-height:70vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;}
  .sheet-title{font-size:13px;font-weight:700;color:var(--amber);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;}
  .sheet-section{margin-bottom:18px;}
  .sheet-section:last-child{margin-bottom:4px;}
  .sheet-label{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .sheet-options{display:flex;flex-direction:column;gap:8px;}
  .sheet-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:inherit;
    font-size:15px;font-weight:600;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left;}
  .sheet-opt.active{border-color:var(--amber);color:var(--amber);}
  .sheet-opt .check{opacity:0;color:var(--amber);font-weight:800;}
  .sheet-opt.active .check{opacity:1;}
  .sheet-row{display:flex;gap:8px;}
  .sheet-row .sheet-opt{flex:1;justify-content:center;}

  .stop-side-btn{flex:0 0 auto;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-size:var(--fs-btn,12px);
    padding:0 8px;border-radius:8px;cursor:pointer;font-family:inherit;min-width:36px;}
  .stop-side-btn.map{color:var(--amber);}
  .stop-side-btn.fav{color:var(--muted);}
  .stop-side-btn.fav.on{color:#e0524a;border-color:#e0524a;}
  .stop-opt .tag{margin-right:4px;}
  body.font-lg{
    --fs-dist:15px;
  }
  body.font-lg .route-opt{padding:14px 12px;}
  body.font-lg .route-num{font-size:22px;}
  body.font-lg .route-dest{font-size:18px;}
  body.font-lg .badge{font-size:14px;padding:4px 8px;}
  body.font-lg .stop-opt{font-size:18px;padding:12px;}
  body.font-lg .stop-opt .tag{font-size:13px;}
  body.font-lg .selected-head .route-num{font-size:28px;}
  body.font-lg .selected-head .route-dest{font-size:18px;}
  body.font-lg .change-btn{font-size:16px;padding:8px 12px;}
  body.font-lg .live-label{font-size:18px;}
  body.font-lg .eta-dest{font-size:17px;}
  body.font-lg .eta-time{font-size:28px;}
  body.font-lg .eta-time small{font-size:14px;}
  body.font-lg .action-btn{font-size:16px;padding:12px;}
  body.font-lg .stop-side-btn{min-width:44px;font-size:16px;}

  body.font-lg .hdr-btn{font-size:16px;padding:8px 14px;}
  body.font-lg .sheet-title{font-size:16px;}
  body.font-lg .sheet-opt{font-size:18px;padding:14px 16px;}
  body.font-lg .sheet{padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px));}
  body.font-lg .sheet-handle{width:48px;height:5px;}

  .stop-row{display:flex;flex-direction:column;gap:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;}
  .stop-row.nearest{border-color:var(--amber);background:#241c0c;}
  .stop-row-l1{font-size:10px;font-weight:800;color:var(--amber);letter-spacing:.04em;margin-bottom:2px;min-height:0;}
  .stop-row-l1:empty{display:none;}
  .stop-row-l2{display:flex;align-items:flex-start;gap:6px;}
  .stop-row-name{flex:1;min-width:0;font-size:var(--fs-stop-name,13.5px);color:var(--text);line-height:1.35;word-break:break-word;white-space:normal;}
  .stop-row-l3{font-size:var(--fs-dist,11px);color:var(--amber);font-weight:700;margin-top:4px;}
  .stop-row-l3:empty{display:none;}
  .stop-side-btn{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:var(--fs-btn,14px);
    padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit;min-width:40px;align-self:center;}
  .stop-side-btn.map{color:var(--amber);}
  .stop-side-btn.fav{color:var(--muted);}
  .stop-side-btn.fav.on{color:#e0524a;border-color:#e0524a;}
  .stop-opt{display:none;}
  body.font-lg{ --fs-stop-name:18px; }
  .stop-fav-line3.has-msg{display:flex !important;}
  .stop-fav-line1 .etas:has(.msg){display:none;}
  .stop-fav-line1 .etas .msg{display:none;}

  footer{margin-top:22px;text-align:center;}
  footer p{font-size:10.5px;color:#565b62;line-height:1.6;}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:#2a2f35;border-radius:3px;}

  /* ========== THEME: LIGHT ========== */
  body.theme-light {
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#eef0f3; --line:#dee1e6;
    --amber:#d98a12; --amber-dim:#b9860f; --text:#1d2024; --muted:#6a7078;
    --kmb:#e4572e; --lwb:#2f8f8f; --ctb:#2f5fce; --danger:#d0483f;
  }
  body.theme-light .bus-banner { background:#ffffff; border-color:var(--line); }
  body.theme-light .banner-overlay {
    background:linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.32) 48%, rgba(255,255,255,0) 78%);
  }
  body.theme-light h1 { color:#15171a; text-shadow:0 1px 4px rgba(255,255,255,.95),0 0 16px rgba(255,255,255,.7); }
  body.theme-light .hdr-btn {
    background:rgba(255,255,255,.82); border:1px solid rgba(20,20,20,.14); color:var(--text);
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  body.theme-light .key:active { background:#e2e5ea; }
  body.theme-light .letter-key:active { background:#e2e5ea; }
  body.theme-light .stop-opt.nearest, body.theme-light .stop-row.nearest { background:#fdf1da; border-color:var(--amber); }
  body.theme-light .board { background:#f8f9fa; border-color:var(--line); }
  body.theme-light .eta-dest { color:#4a4e54; }
  body.theme-light .eta-time { text-shadow:none; }
  body.theme-light .neighbor-row.current { background:#fdf1da; }
  body.theme-light .sheet-opt.active { border-color:var(--amber); color:var(--amber); }

  /* ========== THEME: CARTOON ========== */
  body.theme-cartoon {
    --bg:#fffbf0; --panel:#ffffff; --panel-2:#f4f0e6; --line:#2d3142;
    --amber:#ff9f1c; --amber-dim:#e07a5f; --text:#2d3142; --muted:#6c757d;
    --kmb:#ff5964; --lwb:#2ec4b6; --ctb:#ffbf00; --danger:#e63946;
    font-family:'Fredoka','Noto Sans HK',system-ui,-apple-system,sans-serif;
  }
  body.theme-cartoon .bus-banner {
    border:3px solid var(--line); border-radius:18px; background:#e0f4ff;
    box-shadow: 4px 4px 0px #2d3142; height:auto; overflow:hidden;
  }
  body.theme-cartoon .bus-img { display:none; }
  body.theme-cartoon .banner-overlay { display:none; }
  body.theme-cartoon .cartoon-svg { display:block; width:100%; max-height:150px; }
  body.theme-cartoon h1 {
    color:#2d3142; text-shadow: 2px 2px 0px #ffe5ec; font-weight:700;
  }
  body.theme-cartoon .hdr-btn {
    background:#ffe5ec; border:2.5px solid var(--line); color:var(--text);
    border-radius:14px; box-shadow:2px 2px 0px var(--line); font-size:12.5px;
  }
  body.theme-cartoon .hdr-btn:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--line); }
  body.theme-cartoon .tab-btn {
    border:2.5px solid var(--line); border-radius:16px; box-shadow:3px 3px 0px var(--line);
  }
  body.theme-cartoon .tab-btn.active {
    background:#ff9f1c; color:#fff; border-color:var(--line); text-shadow:1px 1px 0 var(--line);
  }
  body.theme-cartoon .tab-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line); }
  body.theme-cartoon .card {
    border:3px solid var(--line); border-radius:20px; box-shadow:4px 4px 0px #2d3142;
  }
  body.theme-cartoon .route-display {
    background:#fff8e7; border:2.5px solid var(--line); border-radius:14px; color:#ff5964;
  }
  body.theme-cartoon .search-icon-btn {
    background:#2ec4b6; border:2.5px solid var(--line); border-radius:14px; box-shadow:2px 2px 0 var(--line); color:#fff;
  }
  body.theme-cartoon .key {
    background:#fdf0d5; border:2.5px solid var(--line); border-radius:14px; box-shadow:0 4px 0 var(--line);
  }
  body.theme-cartoon .key:active { transform:translateY(4px); box-shadow:0 0 0; background:#f2e3c6; }
  body.theme-cartoon .key.clear { background:#ffe5ec; }
  body.theme-cartoon .key.back { background:#e8fccf; }
  body.theme-cartoon .letter-key {
    background:#e0f4ff; border:2.5px solid var(--line); box-shadow:0 3px 0 var(--line);
  }
  body.theme-cartoon .letter-key:active { transform:translateY(3px); box-shadow:0 0 0; }
  body.theme-cartoon .route-opt {
    border:2.5px solid var(--line); border-radius:14px; box-shadow:2px 2px 0 var(--line);
  }
  body.theme-cartoon .route-opt:active { transform:translate(2px,2px); box-shadow:0 0 0; background:#fff8e7; }
  body.theme-cartoon .badge { border:1.5px solid var(--line); border-radius:8px; color:#fff; }
  body.theme-cartoon .badge-ctb { color:#2d3142; }
  body.theme-cartoon .route-num { color:#ff5964; }
  body.theme-cartoon .change-btn {
    background:#ffe5ec; border:2px solid var(--line); box-shadow:2px 2px 0 var(--line); border-radius:10px;
  }
  body.theme-cartoon .board {
    background:#fff8e7; border:2.5px solid var(--line); border-radius:16px;
  }
  body.theme-cartoon .eta-row { border-bottom:2px dashed #e2d9c8; }
  body.theme-cartoon .eta-dest { color:var(--text); font-weight:600; }
  body.theme-cartoon .eta-time { color:#ff9f1c; text-shadow:1px 1px 0 var(--line); }
  body.theme-cartoon .stop-row {
    border:2.5px solid var(--line); border-radius:14px; box-shadow:2px 2px 0 var(--line); background:#fff;
  }
  body.theme-cartoon .stop-row.nearest { background:#fff8e7; }
  body.theme-cartoon .stop-side-btn { border:2px solid var(--line); border-radius:10px; background:#f4f0e6; font-weight:700; }
  body.theme-cartoon .stop-side-btn.map { background:#e0f4ff; }
  body.theme-cartoon .stop-side-btn.fav.on { color:#ff5964; background:#ffe5ec; }
  body.theme-cartoon .fab {
    border:3px solid var(--line); background:#ffbf00; box-shadow:3px 4px 0 var(--line); color:var(--text);
  }
  body.theme-cartoon .fab:active { transform:translate(2px,2px); box-shadow:1px 1px 0; }
  body.theme-cartoon .neighbor-panel { border:3px solid var(--line); border-radius:22px; box-shadow:4px 4px 0 #2d3142; }
  body.theme-cartoon .neighbor-title { background:#fff8e7; border-bottom:2.5px solid var(--line); color:#ff5964; }
  body.theme-cartoon .neighbor-row.current { background:#fff3b0; border:2px solid var(--line); border-radius:12px; }
  body.theme-cartoon .sheet { border-top:3px solid var(--line); border-left:3px solid var(--line); border-right:3px solid var(--line); border-radius:24px 24px 0 0; }
  body.theme-cartoon .sheet-opt {
    background:#f4f0e6; border:2.5px solid var(--line); box-shadow:2px 2px 0 var(--line); border-radius:14px;
  }
  body.theme-cartoon .sheet-opt.active { background:#ffbf00; color:#2d3142; }
  body.theme-cartoon .stop-fav-card { background:#fff; }
  body.theme-cartoon .stop-fav-line1 .rn { color:#ff5964; }
  body.theme-cartoon .stop-fav-map { background:#e0f4ff; border:2px solid var(--line); box-shadow:2px 2px 0 var(--line); }
  body.theme-cartoon .stop-fav-rm { background:#ffe5ec; border:2px solid var(--line); color:var(--danger); box-shadow:2px 2px 0 var(--line); }

</style>

  async function loadRouteIndex(){
    try{ await loadKmb(); } catch(e){
      els.searchStatus.textContent = 'Could not load the KMB route list. ' + e.message;
      els.searchStatus.classList.add('error');
      return;
    }
    updateSearchStatusIdle();
  }

  async function loadKmb(){
    const res = await fetch(`${KMB_BASE}/route/`);
    if (!res.ok) throw new Error('KMB route list failed');
    const json = await res.json();
    const seen = new Set();
    (json.data || []).forEach(r => {
      const direction = r.bound === 'I' ? 'inbound' : 'outbound';
      const operator = r.co === 'LWB' ? 'LWB' : 'KMB';
      const key = r.route + '|' + direction;
      if (seen.has(key)) return;
      seen.add(key);
      routeIndex.push({
        operator, route: r.route, direction, serviceType: r.service_type,
        fromEn: r.orig_en, toEn: r.dest_en, fromTc: r.orig_tc, toTc: r.dest_tc
      });
    });
  }

  async function lookupCitybus(routeNo){
    if (routeNo in ctbLookupCache) return ctbLookupCache[routeNo];
    try{
      const res = await fetch(`${CTB_BASE}/route/CTB/${encodeURIComponent(routeNo)}`);
      if (!res.ok){ ctbLookupCache[routeNo] = []; return []; }
      const json = await res.json();
      const d = json.data;
      if (!d || !d.route){ ctbLookupCache[routeNo] = []; return []; }
      const entries = [
        { operator:'CTB', route: d.route, direction:'outbound', fromEn: d.orig_en, toEn: d.dest_en, fromTc: d.orig_tc, toTc: d.dest_tc },
        { operator:'CTB', route: d.route, direction:'inbound', fromEn: d.dest_en, toEn: d.orig_en, fromTc: d.dest_tc, toTc: d.orig_tc },
      ];
      ctbLookupCache[routeNo] = entries;
      return entries;
    } catch(_e){ return []; }
  }

  function stopFavKey(e){ return [e.operator, e.route, e.direction||'', e.stopId].join('|'); }
  function loadFavStops(){ try{ const r = localStorage.getItem(FAV_STOPS_KEY); return r ? JSON.parse(r) : []; } catch(_e){ return []; } }
  function saveFavStops(list){ try{ localStorage.setItem(FAV_STOPS_KEY, JSON.stringify(list)); } catch(_e){} }
  function updateSaveStopBtn(){}

  function formatEtaMs(diffMs){
    if (diffMs <= 30000) return { html: t().due, due: true };
    return { html: Math.round(diffMs/60000) + '<small>' + t().min + '</small>', due: false };
  }

  function openMaps(lat, long, name){
    if (lat == null || long == null || isNaN(lat) || isNaN(long)) return;
    try {
      window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${long}`, '_blank');
    } catch(_e){
      location.href = `https://maps.google.com/?q=${lat},${long}`;
    }
  }

  function renderStationsTab(){
    Object.values(favTickTimers).forEach(clearInterval);
    const favs = loadFavStops();
    els.stationsPanel.innerHTML = '';
    if (!favs.length){
      const p = document.createElement('div'); p.className = 'msg'; p.textContent = t().favStopsEmpty;
      els.stationsPanel.appendChild(p);
      return;
    }
    favs.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card stop-fav-card';
      card.dataset.key = stopFavKey(f);
      const stopName = stopDisplayName(f.stopName, f.stopNameTc);
      const dest = destOnly(f);
      const hasCoords = f.lat != null && f.long != null && !isNaN(f.lat) && !isNaN(f.long);
      card.innerHTML = `
        <div class="stop-fav-line1">
          <div class="left">
            <span class="rn">${f.route}</span>
            <span class="to">${t().toPrefix}${dest}</span>
          </div>
          <div class="etas" data-times-inline><span class="msg loading">${t().loadingEta}</span></div>
        </div>
        <div class="stop-fav-line2">
          <span class="sn">${stopName}</span>
          ${hasCoords ? `<button type="button" class="stop-fav-map" title="${t().mapOpen}">✈</button>` : ''}
          <button type="button" class="stop-fav-rm">${t().remove}</button>
        </div>
        <div class="stop-fav-line3">
          <div class="etas" data-times-block></div>
        </div>
      `;
      card.querySelector('.stop-fav-rm').addEventListener('click', (ev) => {
        ev.stopPropagation();
        saveFavStops(loadFavStops().filter(x => stopFavKey(x) !== stopFavKey(f)));
        if (selected && currentStopObj) updateSaveStopBtn();
        renderStationsTab();
      });
      const mapBtn = card.querySelector('.stop-fav-map');
      if (mapBtn){
        mapBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openMaps(f.lat, f.long, stopName);
        });
      }

      let pressTimer = null;
      const startPress = (e) => {
        if (e.target.closest('.stop-fav-rm') || e.target.closest('.stop-fav-map')) return;
        pressTimer = setTimeout(() => { openNeighborPopup(f, card); }, 480);
      };
      const endPress = () => { clearTimeout(pressTimer); };
      card.addEventListener('touchstart', startPress, { passive: true });
      card.addEventListener('mousedown', startPress);
      card.addEventListener('touchend', endPress);
      card.addEventListener('mouseup', endPress);
      card.addEventListener('mouseleave', endPress);
      card.addEventListener('touchmove', () => { clearTimeout(pressTimer); });

      els.stationsPanel.appendChild(card);
      loadFavStopEta(f, card);
    });
  }

  async function loadFavStopEta(f, card){
    const inlineEl = card.querySelector('[data-times-inline]');
    const blockEl = card.querySelector('[data-times-block]');
    const line3 = card.querySelector('.stop-fav-line3');
    if (inlineEl) inlineEl.innerHTML = '';
    if (blockEl) blockEl.innerHTML = `<span class="msg loading">${t().loadingEta}</span>`;
    if (line3) line3.classList.add('has-msg');
    const key = stopFavKey(f);
    if (favTickTimers[key]) clearInterval(favTickTimers[key]);
    try{
      const entries = await fetchEtaEntries(buildEtaFetchFromFav(f));
      renderFavTimes(inlineEl, blockEl, entries, key);
    } catch(e){
      const err = `<span class="msg error">${t().etaError(e.message)}</span>`;
      if (inlineEl) inlineEl.innerHTML = '';
      if (blockEl) blockEl.innerHTML = err;
      if (line3) line3.classList.add('has-msg');
    }
  }

  function renderFavTimes(inlineEl, blockEl, entries, key){
    const line3 = blockEl ? blockEl.closest('.stop-fav-line3') : null;
    if (!entries.length){
      const empty = `<span class="msg">${t().noEta}</span>`;
      if (inlineEl) inlineEl.innerHTML = '';
      if (blockEl) blockEl.innerHTML = empty;
      if (line3) line3.classList.add('has-msg');
      return;
    }
    if (line3) line3.classList.remove('has-msg');
    const html = entries.map(e => `<span class="t" data-eta="${e.time}"></span>`).join('');
    if (inlineEl) inlineEl.innerHTML = html;
    if (blockEl) blockEl.innerHTML = html;
    const tickFn = () => {
      cardTickTargets(inlineEl, blockEl).forEach(el => {
        const target = new Date(el.dataset.eta).getTime();
        const diffMs = target - Date.now();
        const f = formatEtaMs(diffMs);
        el.innerHTML = f.html;
        el.classList.toggle('due', f.due);
      });
    };
    function cardTickTargets(a, b){
      const list = [];
      if (a) a.querySelectorAll('.t').forEach(x => list.push(x));
      if (b) b.querySelectorAll('.t').forEach(x => list.push(x));
      return list;
    }
    tickFn();
    favTickTimers[key] = setInterval(tickFn, 1000);
  }

  function refreshAllFavStops(){
    const cards = els.stationsPanel.querySelectorAll('.stop-fav-card');
    const favs = loadFavStops();
    cards.forEach(card => {
      const key = card.dataset.key;
      const f = favs.find(x => stopFavKey(x) === key);
      if (f) loadFavStopEta(f, card);
    });
  }

  function buildEtaFetchFromFav(f){
    if (f.operator === 'KMB' || f.operator === 'LWB') return { operator: f.operator, route: f.route, serviceType: f.serviceType, stopId: f.stopId };
    return { operator: 'CTB', route: f.route, stopId: f.stopId };
  }

  let neighborHoldActive = false;

  async function openNeighborPopup(f, card){
    els.neighborOverlay.style.display = 'flex';
    els.neighborList.innerHTML = `<div class="msg loading">${t().loadingEta}</div>`;
    neighborHoldActive = true;

    const closeOnRelease = () => {
      if (!neighborHoldActive) return;
      neighborHoldActive = false;
      els.neighborOverlay.style.display = 'none';
      document.removeEventListener('touchend', closeOnRelease);
      document.removeEventListener('mouseup', closeOnRelease);
    };
    document.addEventListener('touchend', closeOnRelease);
    document.addEventListener('mouseup', closeOnRelease);
    els.neighborList.addEventListener('touchmove', (e) => { e.stopPropagation(); }, { passive: true });

    try{
      const stops = await getFullStopsForFav(f);
      if (!stops.length){
        els.neighborList.innerHTML = `<div class="msg">${t().noStops}</div>`;
        return;
      }
      const etaPromises = stops.map(async s => {
        try{
          const entries = await fetchEtaEntries(buildEtaFetchFromFav({ ...f, stopId: s.id }));
          return { stop: s, entries };
        } catch(_e){ return { stop: s, entries: [] }; }
      });
      const results = await Promise.all(etaPromises);
      els.neighborList.innerHTML = '';
      results.forEach(({ stop, entries }) => {
        const isCurrent = stop.id === f.stopId;
        const name = stopDisplayName(stop.name, stop.nameTc);
        const nearest = entries[0];
        let etaHtml = '—';
        if (nearest){
          const diffMs = new Date(nearest.time).getTime() - Date.now();
          etaHtml = formatEtaMs(diffMs).html;
        }
        const row = document.createElement('div');
        row.className = 'neighbor-row' + (isCurrent ? ' current' : '');
        row.innerHTML = `<span class="neighbor-name">${name}</span><span class="neighbor-eta">${etaHtml}</span>`;
        els.neighborList.appendChild(row);
        if (isCurrent) requestAnimationFrame(() => row.scrollIntoView({ block: 'center' }));
      });
    } catch(e){
      els.neighborList.innerHTML = `<div class="msg error">${t().etaError(e.message)}</div>`;
    }
  }

  async function getFullStopsForFav(f){
    const cacheKey = [f.operator, f.route, f.direction||'', f.serviceType||''].join('|');
    if (routeStopsCache[cacheKey]) return routeStopsCache[cacheKey];
    const stops = await getRouteStops({
      operator: f.operator, route: f.route, direction: f.direction, serviceType: f.serviceType
    });
    const withCoords = await attachStopCoords(f.operator, stops);
    withCoords.sort((a,b) => (a.seq||0) - (b.seq||0));
    routeStopsCache[cacheKey] = withCoords;
    return withCoords;
  }

  let searchDebounce, searchToken = 0;
  async function runSearch(){
    const q = queryText.trim().toUpperCase();
    const myToken = ++searchToken;
    if (!q){ els.resultsList.innerHTML = ''; updateSearchStatusIdle(); return; }
    if (selected) closeSelected();
    els.searchStatus.textContent = '';
    els.resultsList.innerHTML = `<div class="msg loading">${t().searching(q)}</div>`;
    const kmbExact = routeIndex.filter(r => r.route === q);
    const ctbExact = await lookupCitybus(q);
    if (myToken !== searchToken) return;
    let matches = kmbExact.concat(ctbExact);
    let fallbackNode = null;
    if (matches.length === 0){
      const prefix = routeIndex.filter(r => r.route.startsWith(q)).slice(0, 20);
      if (prefix.length){
        fallbackNode = document.createElement('div');
        fallbackNode.className = 'hint'; fallbackNode.textContent = t().noExact(q);
        matches = prefix;
      }
    }
    els.resultsList.innerHTML = '';
    if (matches.length === 0){ els.resultsList.innerHTML = `<div class="msg">${t().notFound(q)}</div>`; return; }
    if (fallbackNode) els.resultsList.appendChild(fallbackNode);
    matches.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'route-opt';
      btn.innerHTML = `<span class="badge ${badgeClass(m.operator)}">${m.operator}</span>
        <span class="route-num">${m.route}</span>
        <span class="route-dest">${routeLine(m)}</span>`;
      btn.addEventListener('click', () => selectRoute(m));
      els.resultsList.appendChild(btn);
    });
  }

  function selectRoute(m){
    if (activeTab !== 'search') switchTab('search');
    selected = m;
    els.selBadge.className = 'badge ' + badgeClass(m.operator);
    els.selBadge.textContent = m.operator;
    els.selRoute.textContent = m.route;
    els.selDest.textContent = routeLine(m);
    els.selectedCard.style.display = 'block';
    els.etaBlock.style.display = 'none';
    els.stopList.innerHTML = '';
    els.resultsList.innerHTML = '';
    currentStopObj = null;
    queryText = ''; updateQueryDisplay();
    clearInterval(tickTimer);
    els.selectedCard.scrollIntoView({behavior:'smooth', block:'start'});
    startAutoLocate(m);
  }

  els.changeBtn.addEventListener('click', closeSelected);
  function closeSelected(){
    selected = null;
    els.selectedCard.style.display = 'none';
    els.stopList.innerHTML = '';
    clearInterval(tickTimer);
  }

  async function getRouteStops(m){
    if (m.operator === 'KMB' || m.operator === 'LWB'){
      const res = await fetch(`${KMB_BASE}/route-stop/${encodeURIComponent(m.route)}/${m.direction}/${m.serviceType || '1'}`);
      if (!res.ok) throw new Error('route-stop lookup failed');
      const json = await res.json();
      return (json.data || []).map(s => ({ id: s.stop, seq: s.seq }));
    }
    const res = await fetch(`${CTB_BASE}/route-stop/CTB/${encodeURIComponent(m.route)}/${m.direction}`);
    if (!res.ok) throw new Error('route-stop lookup failed');
    const json = await res.json();
    return (json.data || []).map(s => ({ id: s.stop, seq: s.seq }));
  }

  async function attachStopCoords(operator, stops){
    const results = await Promise.all(stops.map(async s => {
      const key = operator + ':' + s.id;
      if (stopCache[key]) return { ...stopCache[key], id: s.id, seq: s.seq };
      try{
        const url = (operator === 'KMB' || operator === 'LWB') ? `${KMB_BASE}/stop/${s.id}` : `${CTB_BASE}/stop/${s.id}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const json = await res.json();
        const d = json.data;
        if (!d) return null;
        const info = { lat: parseFloat(d.lat), long: parseFloat(d.long), name: d.name_en || d.name_tc || 'Unnamed stop', nameTc: d.name_tc || d.name_en };
        stopCache[key] = info;
        return { ...info, id: s.id, seq: s.seq };
      } catch(_e){ return null; }
    }));
    return results.filter(Boolean);
  }
  function stopLabel(s){ return stopDisplayName(s.name, s.nameTc); }
  function haversine(lat1, lon1, lat2, lon2){
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return R * 2 * Math.asin(Math.sqrt(a));
  }

  function setStopStatus(text, isLoading, isError){
    els.stopStatus.textContent = text;
    els.stopStatus.className = 'msg' + (isError?' error':'') + (isLoading?' loading':'');
  }

  function startAutoLocate(m){
    const myToken = ++locateToken;
    let coords = userCoords ? userCoords.slice() : null;
    let coordsError = userCoords ? null : userCoordsError;
    let coordsDone = !!userCoords || !!userCoordsError;
    let stopsDone = false, stopsErr = null;
    currentStops = [];
    setStopStatus(t().locating, true, false);
    if (navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => {
          userCoords = [pos.coords.latitude, pos.coords.longitude];
          userCoordsError = null;
          coords = userCoords.slice();
          coordsError = null;
          coordsDone = true;
          maybeRender();
        },
        err => {
          if (!coords){ coordsError = err.message; userCoordsError = err.message; }
          coordsDone = true;
          maybeRender();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    } else {
      if (!coords){ coordsError = 'no geolocation'; }
      coordsDone = true;
    }
    getRouteStops(m).then(async stops => {
      if (!stops.length){ stopsErr = t().noStops; stopsDone = true; maybeRender(); return; }
      const withCoords = await attachStopCoords(m.operator, stops);
      withCoords.sort((a,b) => (a.seq||0) - (b.seq||0));
      currentStops = withCoords;
      stopsDone = true; maybeRender();
    }).catch(e => { stopsErr = t().stopsError(e.message); stopsDone = true; maybeRender(); });
    function maybeRender(){
      if (myToken !== locateToken) return;
      if (!stopsDone || !coordsDone) return;
      if (stopsErr){ setStopStatus(stopsErr, false, true); return; }
      if (coordsError && !coords){ setStopStatus(t().locFailed(coordsError), false, true); appendRetryLink(m); }
      else setStopStatus('', false, false);
      let nearestId = null;
      if (coords && currentStops.length){
        let best = null, bestDist = Infinity;
        currentStops.forEach(s => {
          if (isNaN(s.lat) || isNaN(s.long)) return;
          const d = haversine(coords[0], coords[1], s.lat, s.long);
          s._dist = d;
          if (d < bestDist){ bestDist = d; best = s; }
        });
        if (best) nearestId = best.id + '|' + best.seq;
      }
      renderStopList(nearestId, coords);
      if (nearestId){
        const nearest = currentStops.find(s => (s.id+'|'+s.seq) === nearestId);
        if (nearest) selectStop(nearest, true);
      }
    }
  }

  function appendRetryLink(m){
    const link = document.createElement('button');
    link.className = 'retry-link'; link.textContent = t().retryLoc;
    link.addEventListener('click', () => startAutoLocate(m));
    els.stopStatus.appendChild(document.createElement('br'));
    els.stopStatus.appendChild(link);
  }

  function isStopSaved(s){
    if (!selected) return false;
    const cand = { operator:selected.operator, route:selected.route, direction:selected.direction, stopId: s.id };
    return loadFavStops().some(f => stopFavKey(f) === stopFavKey(cand));
  }
  function toggleSaveStop(s){
    if (!selected) return;
    const cand = {
      operator: selected.operator, route: selected.route, direction: selected.direction, serviceType: selected.serviceType,
      fromEn: selected.fromEn, toEn: selected.toEn, fromTc: selected.fromTc, toTc: selected.toTc,
      stopId: s.id, stopName: s.name, stopNameTc: s.nameTc,
      lat: s.lat, long: s.long
    };
    let favs = loadFavStops();
    const exists = favs.some(f => stopFavKey(f) === stopFavKey(cand));
    if (exists) favs = favs.filter(f => stopFavKey(f) !== stopFavKey(cand));
    else favs.push(cand);
    saveFavStops(favs);
    updateSaveStopBtn();
    if (activeTab === 'stations') renderStationsTab();
  }
  function renderStopList(nearestId, coords){
    els.stopList.innerHTML = '';
    const origin = coords || userCoords;
    currentStops.forEach(s => {
      const sid = s.id + '|' + s.seq;
      let distStr = '';
      if (origin && s.lat != null && s.long != null && !isNaN(s.lat) && !isNaN(s.long)){
        const d = s._dist != null ? s._dist : haversine(origin[0], origin[1], s.lat, s.long);
        distStr = formatDist(d);
      }
      const isNearest = sid === nearestId;
      const row = document.createElement('div');
      row.className = 'stop-row' + (isNearest ? ' nearest' : '');
      row.dataset.sid = sid;

      const l1 = document.createElement('div');
      l1.className = 'stop-row-l1';
      if (isNearest) l1.textContent = t().nearestTag;
      row.appendChild(l1);

      const l2 = document.createElement('div');
      l2.className = 'stop-row-l2';
      const name = document.createElement('div');
      name.className = 'stop-row-name';
      name.textContent = stopLabel(s);
      l2.appendChild(name);

      const favBtn = document.createElement('button');
      favBtn.type = 'button';
      favBtn.className = 'stop-side-btn fav' + (isStopSaved(s) ? ' on' : '');
      favBtn.textContent = isStopSaved(s) ? '♥' : '♡';
      favBtn.title = t().saveStop;
      favBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        toggleSaveStop(s);
        favBtn.textContent = isStopSaved(s) ? '♥' : '♡';
        favBtn.classList.toggle('on', isStopSaved(s));
        updateSaveStopBtn();
      });
      l2.appendChild(favBtn);

      if (s.lat != null && s.long != null && !isNaN(s.lat) && !isNaN(s.long)){
        const mapBtn = document.createElement('button');
        mapBtn.className = 'stop-side-btn map';
        mapBtn.type = 'button';
        mapBtn.textContent = '✈';
        mapBtn.title = t().mapOpen + (distStr ? ' · ' + distStr : '');
        mapBtn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          openMaps(s.lat, s.long, stopLabel(s));
        });
        l2.appendChild(mapBtn);
      }
      row.appendChild(l2);

      const l3 = document.createElement('div');
      l3.className = 'stop-row-l3';
      if (distStr) l3.textContent = distStr;
      row.appendChild(l3);

      row.addEventListener('click', (ev) => {
        if (ev.target.closest('.stop-side-btn')) return;
        selectStop(s, false);
      });
      els.stopList.appendChild(row);
      if (isNearest){ requestAnimationFrame(() => row.scrollIntoView({block:'nearest'})); }
    });
  }

  function highlightStop(sid){
    els.stopList.querySelectorAll('.stop-row').forEach(b => {
      const on = b.dataset.sid === sid;
      b.classList.toggle('nearest', on);
      const l1 = b.querySelector('.stop-row-l1');
      if (l1) l1.textContent = on ? t().nearestTag : '';
    });
  }

  async function selectStop(s, isAuto){
    currentStopObj = s;
    if (!isAuto) highlightStop(s.id+'|'+s.seq);
    lastEtaFetch = buildEtaFetch(selected, s);
    els.liveLabel.innerHTML = t().liveFor(stopLabel(s));
    els.etaBlock.style.display = 'block';
    updateSaveStopBtn();
    await loadEta();
    if (isAuto) els.etaBlock.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function buildEtaFetch(m, s){
    if (m.operator === 'KMB' || m.operator === 'LWB') return { operator: m.operator, route: m.route, serviceType: m.serviceType, stopId: s.id };
    return { operator: 'CTB', route: m.route, stopId: s.id };
  }

  async function fetchEtaEntries(spec){
    let entries = [];
    if (spec.operator === 'KMB' || spec.operator === 'LWB'){
      const { route, serviceType, stopId } = spec;
      const res = await fetch(`${KMB_BASE}/eta/${stopId}/${encodeURIComponent(route)}/${serviceType||'1'}`);
      const json = await res.json();
      entries = (json.data||[]).filter(e=>e.eta).map(e=>({ time:e.eta, noteEn:e.rmk_en, noteTc:e.rmk_tc, destEn:e.dest_en, destTc:e.dest_tc }));
    } else {
      const { route, stopId } = spec;
      const res = await fetch(`${CTB_BASE}/eta/CTB/${stopId}/${encodeURIComponent(route)}`);
      const json = await res.json();
      entries = (json.data||[]).filter(e=>e.eta).map(e=>({ time:e.eta, noteEn:e.rmk_en, noteTc:e.rmk_tc, destEn:e.dest_en, destTc:e.dest_tc }));
    }
    entries.sort((a,b) => new Date(a.time) - new Date(b.time));
    return entries.slice(0,3);
  }

  async function loadEta(){
    if (!lastEtaFetch) return;
    els.board.innerHTML = `<div class="msg loading">${t().loadingEta}</div>`;
    try{
      lastEtaEntries = await fetchEtaEntries(lastEtaFetch);
      renderBoard(lastEtaEntries);
    } catch(e){
      els.board.innerHTML = `<div class="msg error">${t().etaError(e.message)}</div>`;
    }
  }

  function renderBoard(entries){
    clearInterval(tickTimer);
    if (!entries.length){ els.board.innerHTML = `<div class="msg">${t().noEta}</div>`; return; }
    els.board.innerHTML = entries.map((e,i) => {
      const dest = lang==='tc' ? (e.destTc||e.destEn) : e.destEn;
      const note = lang==='tc' ? (e.noteTc||e.noteEn) : e.noteEn;
      const destLabel = dest ? (lang==='tc' ? dest : 'to ' + dest) : (selected ? dName(selected,'to') : ('#'+(i+1)));
      return `<div class="eta-row" data-eta="${e.time}">
        <span class="eta-dest">${destLabel}${note ? ' · ' + note : ''}</span>
        <span class="eta-time" data-time></span>
      </div>`;
    }).join('');
    tick(); tickTimer = setInterval(tick, 1000);
  }

  function tick(){
    document.querySelectorAll('#board .eta-row').forEach(row => {
      const target = new Date(row.dataset.eta).getTime();
      const diffMs = target - Date.now();
      const timeEl = row.querySelector('[data-time]');
      if (diffMs <= 30000) timeEl.textContent = t().due;
      else timeEl.innerHTML = Math.round(diffMs/60000) + '<small>' + t().min + '</small>';
    });
  }

  function prefetchLocation(){
    if (!navigator.geolocation){ userCoordsError = 'no geolocation'; return; }
    navigator.geolocation.getCurrentPosition(
      pos => { userCoords = [pos.coords.latitude, pos.coords.longitude]; userCoordsError = null; },
      err => { userCoordsError = err.message; },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }

  function formatDist(meters){
    if (meters == null || isNaN(meters)) return '';
    if (meters < 1000) return Math.round(meters) + 'm';
    return (meters/1000).toFixed(1) + 'km';
  }

  buildKeypad();
  applyStaticText();
  loadRouteIndex();
  updateFabVisibility();
  prefetchLocation();
})();
</script>
