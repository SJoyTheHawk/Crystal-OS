<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>Crystal OS Control Panel</title>
<style>
:root{font:16px/1.5 system-ui,-apple-system,sans-serif;color:#eef2f7;background:#11151a}*{box-sizing:border-box}body{margin:0 auto;padding:32px 20px;max-width:760px}header{margin:12px 0 28px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}.muted{color:#a4afbc}.card{background:#1c222a;border:1px solid #333c47;border-radius:14px;padding:20px;margin:16px 0}h2{font-size:18px;margin:0 0 12px}input{background:#11151a;color:#fff;border:1px solid #596575;border-radius:8px;padding:11px 13px;font:inherit;letter-spacing:.14em;width:150px}button{background:#3478e5;color:#fff;border:0;border-radius:8px;padding:11px 16px;font:600 15px system-ui,sans-serif;cursor:pointer;margin-left:8px}button.secondary{background:#343d48}.status{min-height:24px;margin-top:10px;color:#b7c4d3}.app{padding:13px 0;border-top:1px solid #333c47}.app:first-child{border-top:0}.app strong{display:block}.tag{font-size:13px;color:#a4afbc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.metric{background:#11151a;border-radius:8px;padding:12px}.metric span{display:block;color:#a4afbc;font-size:13px}.hidden{display:none}.log{max-height:260px;overflow:auto;background:#11151a;padding:12px;border-radius:8px;color:#b7c4d3;white-space:pre-wrap}.app-actions{margin-top:8px}.app-actions button{margin:0 6px 0 0;padding:7px 10px;font-size:13px}progress{display:block;width:100%;margin-top:12px}
</style>
</head>
<body>
<header><h1>Crystal OS</h1><div class="muted">Local device control panel</div></header>
<section class="card"><h2>Pair this browser</h2><div class="muted">Enter the six-digit code shown on your device. Pairing is one-use.</div><p><input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Six digit pairing code"><button id="pair">Pair</button></p><div id="pair-status" class="status" role="status"></div></section>
<section id="device" class="hidden"><section class="card"><h2>Device</h2><div id="system" class="grid"></div><p><button id="refresh" class="secondary">Refresh</button><button id="logs" class="secondary">Open logs</button></p><pre id="log-output" class="log hidden"></pre></section><section class="card"><h2>Install package</h2><input id="package" type="file" accept=".capp,application/octet-stream"><button id="install">Install</button><progress id="progress" class="hidden" max="100" value="0"></progress><div id="install-status" class="status"></div></section><section class="card"><h2>Apps</h2><div id="apps" class="muted">Pair to load the installed app list.</div></section></section>
<script>
let token='';let logSource=null;let currentApps=[];
const status=document.querySelector('#pair-status');
async function api(path,options={}){options.headers={...(options.headers||{}),Authorization:`Bearer ${token}`};const response=await fetch(path,{...options,cache:'no-store'});if(!response.ok)throw Error(response.status===401?'Session expired. Pair again.':(await response.text())||`Request failed (${response.status})`);return response.status===204?{}:response.json()}
function metric(label,value){const item=document.createElement('div');item.className='metric';const name=document.createElement('span');name.textContent=label;const val=document.createElement('strong');val.textContent=value;item.append(name,val);return item}
async function appAction(method,id,suffix='/launch'){try{await api(`/api/v1/apps/${encodeURIComponent(id)}${suffix}`,{method});await refresh()}catch(error){status.textContent=error.message}}
async function reorderApp(id,direction){const next=[...currentApps];const from=next.findIndex(app=>app.id===id);const to=from+direction;if(from<0||to<0||to>=next.length)return;[next[from],next[to]]=[next[to],next[from]];try{await api('/api/v1/apps/order',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(next.map((app,index)=>({id:app.id,slot:currentApps[index].slot})))});await refresh()}catch(error){status.textContent=error.message}}
async function refresh(){try{const [system,apps]=await Promise.all([api('/api/v1/system'),api('/api/v1/apps')]);const grid=document.querySelector('#system');grid.replaceChildren(metric('Firmware',system.os_version),metric('Free memory',`${system.free_psram_kb} KiB PSRAM`),metric('App storage',`${system.free_storage_kb} KiB free`),metric('Device',system.serial));currentApps=apps.apps.sort((a,b)=>a.slot-b.slot);const list=document.querySelector('#apps');list.replaceChildren();for(const app of currentApps){const row=document.createElement('div');row.className='app';const name=document.createElement('strong');name.textContent=app.name;const detail=document.createElement('span');detail.className='tag';detail.textContent=`${app.id} · ${app.origin} · ${app.version||'built in'} · ${app.enabled?'enabled':'disabled'}`;const actions=document.createElement('div');actions.className='app-actions';const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=app.enabled?'Disable':'Enable';toggle.onclick=async()=>{try{await api(`/api/v1/apps/${encodeURIComponent(app.id)}/enabled`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!app.enabled})});await refresh()}catch(error){status.textContent=error.message}};const up=document.createElement('button');up.className='secondary';up.textContent='Up';up.disabled=currentApps[0]===app;up.onclick=()=>reorderApp(app.id,-1);const down=document.createElement('button');down.className='secondary';down.textContent='Down';down.disabled=currentApps[currentApps.length-1]===app;down.onclick=()=>reorderApp(app.id,1);actions.append(toggle,up,down);if(app.origin==='package'){const launch=document.createElement('button');launch.textContent='Launch';launch.onclick=()=>appAction('POST',app.id);const remove=document.createElement('button');remove.className='secondary';remove.textContent='Uninstall';remove.onclick=()=>{if(window.confirm(`Uninstall ${app.name} and remove its saved data?`))appAction('DELETE',app.id)};actions.append(launch,remove)}const clear=document.createElement('button');clear.className='secondary';clear.textContent='Clear data';clear.onclick=()=>{if(window.confirm(`Clear saved data for ${app.name}?`))appAction('DELETE',app.id,'/data')};actions.append(clear);row.append(name,detail,actions);list.append(row)}document.querySelector('#device').classList.remove('hidden');status.textContent='Connected to Crystal OS.'}catch(error){token='';document.querySelector('#device').classList.add('hidden');status.textContent=error.message}}
document.querySelector('#pair').addEventListener('click',async()=>{status.textContent='Pairing…';try{const response=await fetch('/api/v1/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.querySelector('#pin').value})});const result=await response.json();if(!response.ok)throw Error(result.error||'Pairing failed');token=result.token;document.querySelector('#pin').value='';await refresh()}catch(error){status.textContent=error.message}});
document.querySelector('#refresh').addEventListener('click',refresh);
document.querySelector('#install').addEventListener('click',()=>{const file=document.querySelector('#package').files[0];if(!file){document.querySelector('#install-status').textContent='Choose a .capp package first.';return}const xhr=new XMLHttpRequest();const progress=document.querySelector('#progress');progress.classList.remove('hidden');progress.value=0;document.querySelector('#install-status').textContent='Uploading…';xhr.open('POST','/api/v1/apps');xhr.setRequestHeader('Authorization',`Bearer ${token}`);xhr.upload.onprogress=e=>{if(e.lengthComputable)progress.value=e.loaded/e.total*100};xhr.onload=async()=>{try{if(xhr.status<200||xhr.status>=300)throw Error(xhr.responseText||`Install failed (${xhr.status})`);document.querySelector('#install-status').textContent='Installed. Restart or enable it from Manage Apps.';await refresh()}catch(error){document.querySelector('#install-status').textContent=error.message}};xhr.onerror=()=>document.querySelector('#install-status').textContent='Upload failed.';xhr.send(file)});
document.querySelector('#logs').addEventListener('click',async()=>{const output=document.querySelector('#log-output');output.classList.toggle('hidden');if(logSource){logSource.abort();logSource=null}if(!output.classList.contains('hidden')){output.textContent='';const controller=new AbortController();logSource=controller;try{const response=await fetch('/api/v1/logs',{headers:{Authorization:`Bearer ${token}`},signal:controller.signal});if(!response.ok)throw Error('Log stream failed');const reader=response.body.getReader();const decoder=new TextDecoder();while(true){const part=await reader.read();if(part.done)break;output.textContent+=decoder.decode(part.value,{stream:true}).replace(/^data: /gm,'');output.scrollTop=output.scrollHeight}}catch(error){if(error.name!=='AbortError')output.textContent+=error.message+'\n'}}});
</script>
</body>
</html>
