version: 1
board: esp32_p4_wifi6_touch_lcd_4b
chip: esp32p4

devices:
  audio_dac:
    type: audio_codec
    peripherals:
    - gpio_pa_control
    - i2s_audio_out
    - i2c_master

  audio_adc:
    type: audio_codec
    peripherals:
    - i2s_audio_in
    - i2c_master

  fs_spiffs:
    type: fs_spiffs

  sdcard_power_ctrl:
    type: power_ctrl
    sub_type: gpio
    peripherals:
    - gpio_sd_power

  fs_sdcard:
    type: fs_fat
    sub_type: sdmmc
    io:
      clk: 43
      cmd: 44
      d0: 39
      d1: 40
      d2: 41
      d3: 42

  display_lcd:
    type: display_lcd
    sub_type: dsi
    peripherals:
    - ldo_mipi
    - dsi_display
    dependencies:
      waveshare/esp_lcd_st7703: ^2.0.0
      espressif/esp_lcd_jd9365: ^2.0.2
    io:
      reset_gpio_num: 27

  lcd_touch:
    type: lcd_touch
    sub_type: i2c
    peripherals:
    - i2c_master
    dependencies:
      espressif/esp_lcd_touch_gt911: 1.2.1
    io:
      rst_gpio_num: 23

  lcd_brightness:
    type: ledc_ctrl
    peripherals:
    - ledc_backlight

  camera:
    type: camera
    sub_type: csi
    peripherals:
    - i2c_master
    - ldo_mipi

peripherals:
  i2c_master:
    type: i2c
    role: master
    io:
      sda_io_num: 7
      scl_io_num: 8

  i2s_audio_out:
    type: i2s
    role: master
    format: std-out
    io:
      mclk: 13
      bclk: 12
      ws: 10
      dout: 9
      din: 11

  i2s_audio_in:
    type: i2s
    role: master
    format: tdm-in
    io:
      mclk: 13
      bclk: 12
      ws: 10
      dout: 9
      din: 11

  gpio_pa_control:
    type: gpio
    role: io
    io:
      pin: 53

  gpio_sd_power:
    type: gpio
    role: io
    io:
      pin: 45

  ldo_mipi:
    type: ldo

  dsi_display:
    type: dsi

  ledc_backlight:
    type: ledc
    io:
      gpio_num: 26
board_path: /Users/szemy/Workspace/ESP32 Crystal OS/managed_components/waveshare__waveshare_boards/boards/esp32_p4_wifi6_touch_lcd_4b
